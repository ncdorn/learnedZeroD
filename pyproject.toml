[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learnedzerod"
version = "0.1.0"
description = "Richter-style 0D JSON + centerline → learned junction and vessel parameters (NN)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "jax>=0.4",
    "jaxlib>=0.4",
    "numpy>=1.23",
    "optax>=0.2",
    "vtk>=9.2",
    "dill>=0.3",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
learned-zerod = "learnedzerod.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
learnedzerod = ["models/**/*"]
